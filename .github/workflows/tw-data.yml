name: 更新台股資料
on:
  schedule:
    - cron: '45 6 * * 1-5'   # 台灣時間 14:45
    - cron: '30 8 * * 1-5'   # 台灣時間 16:30（上櫃與營收資料較晚）
  workflow_dispatch:
  push:
    paths:
      - 'scripts/tw-fetch.mjs'
      - 'tw/stocks.json'
      - '.github/workflows/tw-data.yml'
permissions:
  contents: write
concurrency:
  group: tw-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 抓資料
        run: node scripts/tw-fetch.mjs
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw/data.json tw/dt-history.json
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "更新台股資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
