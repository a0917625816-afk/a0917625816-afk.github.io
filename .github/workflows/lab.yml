name: 策略實驗室
on:
  workflow_dispatch:
  push:
    paths:
      - 'lab/run.mjs'
      - 'lab/run2.mjs'
      - 'lab/run3.mjs'
      - 'lab/run4.mjs'
      - 'lab/run5.mjs'
      - 'lab/run7.mjs'
      - 'lab/run8.mjs'
      - 'lab/run9.mjs'
      - 'lab/run10.mjs'
      - 'lab/run11.mjs'
      - 'lab/run12.mjs'
      - 'lab/run13.mjs'
      - 'lab/run14.mjs'
      - 'lab/run15.mjs'
      - 'lab/run16.mjs'
      - 'lab/run17.mjs'
      - 'lab/run18.mjs'
      - '.github/workflows/lab.yml'
permissions:
  contents: write
concurrency:
  group: lab
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 回測
        run: set -o pipefail; node --max-old-space-size=6000 lab/run18.mjs 2>&1 | tee lab/log18.txt
      - name: 存檔
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f lab/log18.txt; git add lab/results18.json lab/report18.md lab/data/fo-daily.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "策略實驗室結果 $(TZ=Asia/Taipei date '+%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
