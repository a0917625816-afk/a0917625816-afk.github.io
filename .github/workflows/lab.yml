name: 策略實驗室
on:
  workflow_dispatch:
  push:
    paths:
      - 'lab/run.mjs'
      - '.github/workflows/lab.yml'
permissions:
  contents: write
concurrency:
  group: lab
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 回測
        run: node lab/run.mjs
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/results.json lab/report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "策略實驗室結果 $(TZ=Asia/Taipei date '+%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
