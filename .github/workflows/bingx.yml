name: 更新 BingX 合約清單
on:
  schedule:
    - cron: '7 * * * *'   # 每小時
  workflow_dispatch:
  push:
    paths:
      - 'scripts/bingx-list.mjs'
      - '.github/workflows/bingx.yml'
permissions:
  contents: write
concurrency:
  group: bingx-list
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/bingx-list.mjs
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bingx.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "更新 BingX 合約清單 $(TZ=Asia/Taipei date '+%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
