<script>(function(){var q=new URLSearchParams(location.search);if(q.get("theme"))document.documentElement.setAttribute("data-theme",q.get("theme"));if(q.get("embed"))document.documentElement.classList.add("embed");})();</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>部門交易模擬器</title>

<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16181d;--muted:#7c828d;--line:#eceef1;--soft:#f3f4f6;--green:#0ab84f;--red:#ef4d63;--greenS:#e6f7ec;--redS:#fde9ec;--blue:#2a6df5;--warn:#e88a00;--term:#0d1117;--termInk:#c9d1d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--card:#151821;--ink:#eef0f4;--muted:#8b93a3;--line:#232836;--soft:#1c2030;--greenS:#0f2a1a;--redS:#2c1218}}
:root[data-theme="dark"]{--bg:#0b0d12;--card:#151821;--ink:#eef0f4;--muted:#8b93a3;--line:#232836;--soft:#1c2030;--greenS:#0f2a1a;--redS:#2c1218}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 40px;display:grid;gap:12px}
.wrap>*{min-width:0}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header h1{margin:0;font-size:19px;font-weight:800}
header a{color:var(--blue);font-size:14px;text-decoration:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs button{flex:none;font:700 14px inherit;font-family:inherit;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px;background:var(--muted)}
.tabs button .dot.on{background:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.top{grid-template-columns:1fr}}
.pair{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pair b{font-size:24px;font-weight:900;letter-spacing:.01em}
.chg{font-weight:700}
.up{color:var(--green)}.dn{color:var(--red)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:8px}
.kv dt{color:var(--muted);border-bottom:1px dashed var(--line)}.kv dd{margin:0;text-align:right;font-weight:600}
.rules{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.6}
.lev{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;flex-wrap:wrap}
.lev select{font:inherit;font-weight:700;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.term{background:var(--term);color:var(--termInk);border-radius:12px;padding:12px 14px;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang TC",monospace;height:330px;overflow:auto}
.term .t{color:#6e7681}.term .ok{color:#3fb950}.term .no{color:#f85149}.term .hi{color:#e3b341}.term .cy{color:#58a6ff}
.term .cur::after{content:"▌";animation:blink 1s steps(1) infinite;color:#58a6ff}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.term .cur::after{animation:none}}
.subtabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.subtabs button{font:700 15px inherit;font-family:inherit;padding:7px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.subtabs button[aria-pressed="true"]{background:var(--soft);color:var(--ink);border-color:var(--soft)}
.list{display:grid;gap:0}
.pos{padding:14px 0;border-top:1px solid var(--line);display:grid;gap:10px}
.pos:first-child{border-top:0}
.ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ph b{font-size:18px;font-weight:900}
.tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--soft)}
.tag.long{background:var(--greenS);color:var(--green)}.tag.short{background:var(--redS);color:var(--red)}
.pnl{text-align:right}
.pnl span{font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line)}
.pnl b{display:block;font-size:22px;font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}
.grid3 div{display:grid}
.grid3 span{font-size:12px;color:var(--muted)}
.grid3 b{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.grid3 div:nth-child(3n){text-align:right}
.warnline{font-size:13px;font-weight:700;color:var(--red);background:var(--redS);border-radius:8px;padding:6px 10px}
.okline{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:6px 10px}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.hist td{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tw{overflow-x:auto}
.foot{font-size:12px;color:var(--muted)}
#board tr[data-k]{cursor:pointer}#board tr[data-k]:hover td{background:var(--soft)}#board tr.sel td{background:var(--soft)}
.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--muted)}.badge.g{background:var(--greenS);color:var(--green)}.badge.r{background:var(--redS);color:var(--red)}
.embed header{display:none}.embed .wrap{padding-top:4px}
.rbtn{font:700 13px inherit;font-family:inherit;padding:5px 12px;border-radius:99px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer}
.rbtn.stop{background:transparent;color:var(--blue)}
.replay{font-size:12px;font-weight:700;color:var(--blue);background:var(--soft);border-radius:99px;padding:2px 10px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>部門交易模擬器</h1>
    <a href="./">← 群星指揮艙</a>
  </header>
  <section class="card" style="display:grid;gap:6px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><b>部門排行</b><span class="foot">先比平均每筆賺幾 R（期望值），再比勝率；未滿 15 筆的「樣本不足」，排名僅供參考。點一列可切換部門</span></div>
    <div class="tw"><table class="hist" id="board"></table></div>
  </section>
  <nav class="tabs" id="tabs" aria-label="部門"></nav>
  <section class="top">
    <div class="card">
      <div class="pair"><b id="gName">—</b><span class="chg" id="gChg"></span></div>
      <dl class="kv" id="acct"></dl>
      <div class="lev"><label for="lev">顯示槓桿</label><select id="lev"><option>5</option><option selected>10</option><option>20</option><option>50</option><option>100</option><option>200</option><option>500</option></select><span class="foot">只影響「保證金、強平價、風險率」怎麼算（劇本單用它自己寫的槓桿）；每筆實際風險固定是本金 1%</span></div>
      <p class="rules" id="rules"></p>
    </div>
    <div class="card" style="display:grid;gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b>執行過程</b><span style="display:flex;gap:8px;align-items:center"><span class="foot" id="runAt"></span><button type="button" class="rbtn" id="rp">▶ 重播最近 5 筆</button></span></div>
      <div class="term" id="term" aria-live="polite"></div>
    </div>
  </section>
  <section class="card" style="display:grid;gap:8px">
    <div class="subtabs" id="sub"></div>
    <div id="body"></div>
  </section>
  <p class="foot">全部是虛擬單（每個部門一個 10,000 USDT 的模擬帳戶，每筆最多賠本金 1%），由雲端機器人每 5 分鐘自動執行；標記價格每 5 分鐘更新，加密貨幣持倉另外接 Binance 即時標記價。不是投資建議。</p>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (p, d) => { if (p == null || !isFinite(p)) return "—"; const a = Math.abs(p); d = d ?? (a >= 1000 ? 2 : a >= 10 ? 3 : a >= 1 ? 4 : a >= 0.01 ? 5 : 7); return (+p).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }); };
const usd = v => (v == null || !isFinite(v)) ? "—" : (+v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const tw = t => t ? new Date(t).toLocaleString("zh-TW", { timeZone: "Asia/Taipei", hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const hm = t => new Date(t).toLocaleTimeString("zh-TW", { timeZone: "Asia/Taipei", hour12: false, hour: "2-digit", minute: "2-digit" });
const ACC = 10000, MMR = 0.005;
const DEPTS = [
  { key: "A", name: "波段 A", get: B => B, rules: "4 小時 K 突破 55 根新高才做多，且要：BTC 日線在 EMA50 之上、該幣 20 天漲幅前 10 名、4h 在 EMA200 之上。停損 2 倍 ATR，跌破前 27 根低點出場。" },
  { key: "b", name: "波段 B", get: B => B.b, rules: "進場同波段 A；漲到 1R 先平 1/3，剩下停損移到成本。" },
  { key: "intra", name: "日內", get: B => B.intra, rules: "15 分 K 突破 48 小時新高＋同濾網＋量能放大、收在 K 棒上半段；台灣 04:00 後不進場、08:00 平倉。（11/11 起停止新開單：第二十輪審查表補測成本 ×1.5 後平均R 轉負＝邊太薄；紀錄保留，日內 B／C／D 照跑。）" },
  { key: "intra2", name: "日內 B", get: B => B.intra2, rules: "同日內，只做日均成交額 ≥5 億 U 的大幣。" },
  { key: "intra3", name: "日內 C", get: B => B.intra3, rules: "同日內 B，加上 FOMC／CPI／非農公布前後 4 小時不開新單。" },
  { key: "intra4", name: "日內 D", get: B => B.intra4, rules: "同日內（成交額 ≥1 億 U），但前一天 BTC 收盤「趨勢上」（高於日線 EMA50 達 3%、非恐慌）不開新單——追已經漲多的市場不划算（11/08 第十七輪審查通過）。" },
  { key: "scen", name: "劇本單", get: B => B.scen, rules: "盤前室（東京／倫敦／紐約）AI 劇本員寫劇本、下單員照劇本掛單，可多可空；每筆固定賠本金 1%。" },
  { key: "fib", name: "斐波下單員", get: B => B.fib, rules: "黃金、那指在各開盤：開盤前 2 小時區間，破區間後在 -0.5 反向掛單、停損 -1.0、目標回到 0 線；最多抱 4 小時。（回測扣成本不賺，實驗觀察組；11/11 滿 30 筆平均 −0.69R，依 10/31 規則停止新開單，紀錄保留）" },
  { key: "gnSwing", name: "黃金波段", get: B => B.gnSwing, rules: "黃金 4h 收盤突破 55 根新高（在 EMA200 之上）做多、跌破新低（在 EMA200 之下）做空；停損 2ATR。（觀察組）" },
];
let BOT = null, INTEL = {}, cur = "A", sub = "pos", live = {}, ws = null, typing = null;
try { cur = localStorage.getItem("simDept") || "A"; } catch (e) {}

function norm(p, dept) {
  const side = p.side || (p.dir < 0 ? "short" : "long"), dir = side === "short" ? -1 : 1;
  const e = p.e ?? p.entry, stop = p.stop, sym = p.base || p.sym, r = p.r ?? Math.abs(e - stop);
  return { ...p, side, dir, e, stop, sym, r, target: p.target, lev0: p.lev, t: p.t };
}
function equityOf(G) { return ACC * (G && G.equity != null ? G.equity : 1); }
function sizing(p, G) {
  const risk = (p.amt != null ? p.amt : 0.01 * (G && G.equity || 1)) * ACC; // 這筆最多賠多少 USDT
  const qty = p.r > 0 ? risk / p.r : 0, notional = qty * p.e;
  return { risk, qty, notional };
}
function markOf(p) { if (p.replayMark != null) return p.replayMark; const k = (p.sym || "").toUpperCase(); return live[k] ?? p.cur ?? p.e; }
function posCard(p0, G) {
  const p = norm(p0), L = p.lev0 || +$("lev").value, s = sizing(p, G), mk = markOf(p);
  const margin = s.notional / L, pnl = p.dir * (mk - p.e) * s.qty * (p.left ?? (p.took ? 2 / 3 : 1)) + (p.real ? p.real * s.risk : 0), pnlPct = margin > 0 ? pnl / margin * 100 : 0;
  const liq = p.dir > 0 ? p.e * (1 - 1 / L + MMR) : p.e * (1 + 1 / L - MMR);
  const liqFirst = p.dir > 0 ? liq >= p.stop : liq <= p.stop;
  const riskRate = margin > 0 ? Math.max(0, (s.notional * MMR) / (margin + pnl) * 100) : 0;
  const isCrypto = !/黃金|那指/.test(p.sym);
  return `<div class="pos">
    <div class="ph"><div><b>${esc(p.sym)}${isCrypto ? "USDT" : ""}</b><div class="tags"><span class="tag ${p.side}">${p.dir > 0 ? "多" : "空"}</span><span class="tag">逐倉</span><span class="tag">${L}x</span>${p.took ? `<span class="tag">已先平 1/3</span>` : ""}${p.protected === "half" ? `<span class="tag">事件保護：已先平一半＋保本</span>` : p.protected === "be" ? `<span class="tag">事件保護：停損移到保本</span>` : ""}${p.protectAt && !p.protected ? `<span class="tag">事件保護 ${tw(p.protectAt)}</span>` : ""}${p.session ? `<span class="tag">${esc(p.session)}</span>` : ""}${p0.riskMul && p0.riskMul < 1 ? `<span class="tag">兩段掛・${Math.round(p0.riskMul * 100)}% 份量</span>` : ""}</div></div>
      <div class="pnl"><span>未實現盈虧 (USDT)</span><b class="${pnl >= 0 ? "up" : "dn"}">${pnl >= 0 ? "+" : ""}${usd(pnl)} <small style="font-size:15px">(${pnlPct >= 0 ? "+" : ""}${pnlPct.toFixed(2)}%)</small></b></div></div>
    <div class="grid3">
      <div><span>持倉 (USDT)</span><b>${usd(s.notional)}</b></div><div><span>保證金 (USDT)</span><b>${usd(margin)}</b></div><div><span>風險率</span><b class="${riskRate > 80 ? "dn" : "up"}">${riskRate.toFixed(2)}%</b></div>
      <div><span>開倉均價</span><b>${fmt(p.e)}</b></div><div><span>標記價格</span><b>${fmt(mk)}</b></div><div><span>預估強平價</span><b class="${liqFirst ? "dn" : "up"}">${fmt(liq)}</b></div>
      <div><span>止損</span><b class="dn">${fmt(p.stop)}</b></div><div><span>止盈</span><b class="up">${p.target != null ? fmt(p.target) : "跟著通道走"}</b></div><div><span>開倉時間</span><b>${tw(p.t)}</b></div>
    </div>
    ${liqFirst ? `<div class="warnline">⚠️ ${L} 倍時，強平價 ${fmt(liq)} 比止損 ${fmt(p.stop)} 還近：價格還沒到止損就會先爆倉，損失整筆保證金。</div>` : `<div class="okline">這筆最多賠 ${usd(s.risk)} USDT（本金約 1%）；${L} 倍下強平價在止損外面，安全。</div>`}${tmLine(p0.tm)}
  </div>`;
}
function tmLine(tm) {
  if (!tm) return "";
  if (tm.err) return `<div class="okline">⏳ 時光機：${esc(tm.err)}</div>`;
  const f = tm.pFill || 1, tg = Math.round(tm.pTarget / f * 100), sp = Math.round(tm.pStop / f * 100), ti = Math.max(0, 100 - tg - sp);
  return `<div class="okline">⏳ 時光機（重演近 ${tm.days} 天走勢 ${tm.paths} 次）：成交機率 <b>${tm.pFill}%</b>；成交後 先到止盈 <b class="up">${tg}%</b>・先到止損 <b class="dn">${sp}%</b>・到期平倉 ${ti}%；每張期望 <b class="${tm.evR > 0 ? "up" : tm.evR < 0 ? "dn" : ""}">${tm.evR > 0 ? "+" : ""}${tm.evR}R</b>${tm.evRFilled != null ? `（成交的話 ${tm.evRFilled > 0 ? "+" : ""}${tm.evRFilled}R）` : ""}</div>`;
}
function tmCal(G) {
  const t = G.stats && G.stats.tm; if (!t || !t.n) return `<div class="okline">⏳ 時光機：新掛單會自動估算成交與止盈止損機率；累積結束的單後，這裡會顯示「預估 vs 實際」準不準。</div>`;
  const c = (a, b) => `預估 ${a == null ? "—" : Math.round(a) + "%"}／實際 ${b == null ? "—" : b + "%"}`;
  return `<div class="okline">⏳ 時光機準不準（${t.n} 張已結束，${t.filledN} 張有成交）：成交率 ${c(t.predFill, t.realFill)}；止盈率 ${c(t.predTarget, t.realTarget)}；止損率 ${c(t.predStop, t.realStop)}；每張平均 預估 ${t.predEvR ?? "—"}R／實際 ${t.realAvgR ?? "—"}R${t.n < 20 ? "（不滿 20 張，先參考）" : ""}</div>`;
}
function orders(dk, G) {
  if (dk === "scen") return Object.values(G.waiting || {});
  if (dk === "fib") return (G.plan || []).map(p => ({ sym: p.sym, session: p.session, plan: p }));
  return [];
}
function orderCard(o, dk) {
  if (o.plan) { const p = o.plan; return `<div class="pos"><div class="ph"><div><b>${esc(p.sym)}</b><div class="tags"><span class="tag">${esc(p.session)} ${hm(p.T)}</span><span class="tag">${p.building ? "盤前・區間形成中" : p.armed ? (p.armed === "long" ? "已跌破・等多單" : "已突破・等空單") : "開盤中・等破區間"}</span></div></div></div>
    <div class="grid3"><div><span>區間高</span><b>${fmt(p.H)}</b></div><div><span>區間低</span><b>${fmt(p.L)}</b></div><div><span>&nbsp;</span><b></b></div>
    <div><span>多單掛單價</span><b class="up">${fmt(p.longE)}</b></div><div><span>多單止損</span><b class="dn">${fmt(p.longS)}</b></div><div><span>目標</span><b>${fmt(p.L)}</b></div>
    <div><span>空單掛單價</span><b class="dn">${fmt(p.shortE)}</b></div><div><span>空單止損</span><b class="dn">${fmt(p.shortS)}</b></div><div><span>目標</span><b>${fmt(p.H)}</b></div></div></div>`; }
  const d = o.side === "short" ? -1 : 1, L = o.lev || +$("lev").value, liq = d > 0 ? o.entry * (1 - 1 / L + MMR) : o.entry * (1 + 1 / L - MMR), liqFirst = d > 0 ? liq >= o.stop : liq <= o.stop;
  const rr = Math.abs(o.target - o.entry) / Math.abs(o.entry - o.stop);
  return `<div class="pos"><div class="ph"><div><b>${esc(o.base)}USDT</b><div class="tags"><span class="tag ${o.side}">${d > 0 ? "限價開多" : "限價開空"}</span><span class="tag">${L}x</span><span class="tag">型態 ${esc(o.pattern)}</span>${o.risk && +o.risk < 1 ? `<span class="tag">兩段掛・${Math.round(o.risk * 100)}% 份量</span>` : ""}<span class="tag">${esc(o.session)}</span></div></div>
